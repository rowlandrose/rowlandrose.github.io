<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flash Music Maker · Rowland Rose</title>
  <style>
    :root { --bg: #11181b; --ink: #e3e8ea; --accent: #5cc5c0; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p { margin: 0 0 16px; color: #a7b3b8; }
    a { color: var(--accent); }
    #player { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; overflow: hidden; }
    #player ruffle-player, #player ruffle-object, #player embed { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Flash Music Maker</h1>
    <p>Create music with bouncing balls. Built in ActionScript; it runs here through the <a href="https://ruffle.rs/">Ruffle</a> Flash emulator. <a href="/">Back to rowlandrose.com</a></p>
    <div id="player"></div>
  </div>
  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.0-nightly.2026.10.1/ruffle.js"></script>
  <script>
    window.addEventListener('load', function () {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      document.getElementById('player').appendChild(player);
      player.load('flash_music_maker.swf');
    });
  </script>
</body>
</html>
